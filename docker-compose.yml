version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeaplay
      POSTGRES_USER: zeaplay
      POSTGRES_PASSWORD: zeaplay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "4380:6379"

  backend:
    build:
      context: ./backend
    environment:
      VEE_DATABASE_URL: ${VEE_DATABASE_URL:-postgresql://postgres:9FHI3%21GyE75%23@167.86.108.178:5432/Symphozen}
      VEE_CACHE_REDIS_URL: ${VEE_CACHE_REDIS_URL:-redis://redis:6379}
      VEE_JWT_SECRET_KEY: ${VEE_JWT_SECRET_KEY:-change_me}
      VEE_JWT_REFRESH_SECRET_KEY: ${VEE_JWT_REFRESH_SECRET_KEY:-change_me_refresh}
      VEE_ENVIRONMENT: ${VEE_ENVIRONMENT:-development}
      # Reference for deployments using symphozen.* domains/ports
      VEE_DEPLOYMENT_FRONTEND_HOST: play.ideashop.zeacrm.com
      VEE_DEPLOYMENT_BACKEND_HOST: api.symphozen.zeacrm.com
    ports:
      # Nginx Proxy Manager routes api.symphozen.zeacrm.com -> 4211
      - "4211:6211"
    depends_on:
      - postgres
      - redis

  presence:
    build:
      context: ./presence-server
    environment:
      PRESENCE_PORT: 6212
      PRESENCE_REDIS_URL: ${PRESENCE_REDIS_URL:-redis://redis:6379}
      PRESENCE_JWT_SECRET: change_me
      PRESENCE_JWT_ALGORITHM: HS256
      PRESENCE_EVENTS_CHANNEL: presence:events
    ports:
      - "4212:6212"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.symphozen.zeacrm.com/api
        VITE_API_URL: https://api.symphozen.zeacrm.com/api
        VITE_PRESENCE_URL: https://api.symphozen.zeacrm.com
    ports:
      # Nginx Proxy Manager routes play.ideashop.zeacrm.com -> 4200
      - "4200:80"
    environment:
      FRONTEND_DEPLOY_HOST: play.ideashop.zeacrm.com
      BACKEND_DEPLOY_HOST: api.symphozen.zeacrm.com
    depends_on:
      - backend
      - presence

volumes:
  postgres_data:



