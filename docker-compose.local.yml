version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeaplay
      POSTGRES_USER: zeaplay
      POSTGRES_PASSWORD: zeaplay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "4380:6379"

  backend:
    build:
      context: ./backend
    environment:
      VEE_DATABASE_URL: postgresql://zeaplay:zeaplay@postgres:5432/zeaplay
      VEE_CACHE_REDIS_URL: redis://redis:6379
      VEE_ENVIRONMENT: development
      VEE_JWT_SECRET_KEY: change_me
      VEE_JWT_REFRESH_SECRET_KEY: change_me_refresh
      VEE_CORS_ALLOW_ORIGINS: '["http://localhost:4200","http://127.0.0.1:4200","http://localhost:3000"]'
      VEE_WEBHOOK_SCHEMA_SYNC_ON_STARTUP: "false"
      VEE_MEDIA_PUBLIC_BASE: http://localhost:4211/uploads
    ports:
      - "4211:6211"
    depends_on:
      - postgres
      - redis

  presence:
    build:
      context: ./presence-server
    environment:
      PRESENCE_PORT: 6212
      PRESENCE_REDIS_URL: redis://redis:6379
      PRESENCE_JWT_SECRET: change_me
      PRESENCE_JWT_ALGORITHM: HS256
      PRESENCE_EVENTS_CHANNEL: presence:events
    ports:
      - "4212:6212"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_API_URL: /api
        VITE_PRESENCE_URL: http://localhost:4212
    ports:
      - "4200:80"
    depends_on:
      - backend
      - presence

volumes:
  postgres_data:

